version: '3.8'

services:
  app-blue:
    image: nginxdemos/hello:plain-text
    container_name: app-blue
    ports:
      - "8080:80"

  app-green:
    image: nginxdemos/hello:plain-text
    container_name: app-green
    ports:
      - "8081:80"

  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
